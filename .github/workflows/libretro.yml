name: libretro

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/libretro.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/libretro.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact: lupinho_libretro.so
          - name: macos
            os: macos-latest
            artifact: lupinho_libretro.dylib
          - name: windows
            os: windows-latest
            artifact: lupinho_libretro.dll

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      - name: Build
        if: runner.os != 'Windows'
        working-directory: src
        run: make libretro

      - name: Build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: src
        run: make libretro

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: lupinho-libretro-${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/lupinho_libretro.info
          if-no-files-found: error
